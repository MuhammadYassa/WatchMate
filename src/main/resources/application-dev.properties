# --- Dev profile: runs against the local Docker stack (docker-compose.dev.yml) ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# --- MySQL (dockerized dev DB; defaults match docker-compose.dev.yml) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/watchmate}
spring.datasource.username=${DB_USERNAME:watchmate}
spring.datasource.password=${DB_PASSWORD:watchmate}

# --- Redis (dockerized dev, no password) ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
watchmate.cache.enabled=${WATCHMATE_CACHE_ENABLED:true}

# --- Local frontend domain & CORS ---
app.domain=${APP_DOMAIN:http://localhost:5173}
watchmate.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

jwt.secret=${JWT_SECRET}
