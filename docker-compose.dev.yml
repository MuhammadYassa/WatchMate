services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: watchmate-app-dev
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-watchmate}
      DB_USERNAME: ${MYSQL_USER:-watchmate}
      DB_PASSWORD: ${MYSQL_PASSWORD:-watchmate}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      WATCHMATE_CACHE_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET}
      TMDB_API_TOKEN: ${TMDB_API_TOKEN}
      APP_DOMAIN: ${APP_DOMAIN:-http://localhost:5173}
      VERIFIED_SENDER: ${VERIFIED_SENDER}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/app/logs

  mysql:
    container_name: watchmate-mysql-dev
    restart: unless-stopped
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-watchmate}
      MYSQL_USER: ${MYSQL_USER:-watchmate}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-watchmate}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-watchmate}
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    volumes:
      - mysql_dev_data:/var/lib/mysql

  redis:
    container_name: watchmate-redis-dev
    restart: unless-stopped
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - redis_dev_data:/data

volumes:
  mysql_dev_data:
  redis_dev_data:
